<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rescue Missions | GNR2022</title>
<meta name="description" content="ภารกิจกู้โซน GNR2022: ฝึกข้อที่ห้องพลาดในกลางภาค โซน 4 5 6 แบบข้อสอบจริง พร้อมแยกความเข้าใจผิดจากการเดา">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2307070f'/><path d='M50 14 84 30v24c0 18-14 30-34 34C30 84 16 72 16 54V30z' fill='none' stroke='%23facc15' stroke-width='8'/><path d='M36 52l10 10 18-22' fill='none' stroke='%2300f0ff' stroke-width='8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Kanit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070f;--bg2:#0d0d1d;--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);--edge:rgba(255,255,255,.11);
  --text:#f4f4ff;--mute:#a7a8c8;--dim:#6f7096;--ok:#4ade80;--bad:#fb7185;--warn:#facc15;--z:#ff6a1f;
  --disp:'Chakra Petch','Kanit',sans-serif;--font:'Kanit',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3f4fb;--bg2:#e7e9f6;--glass:rgba(255,255,255,.85);--glass2:#fff;--edge:rgba(20,22,60,.14);
  --text:#12132a;--mute:#4b4e72;--dim:#7a7da0;--ok:#15803d;--bad:#be123c;--warn:#a16207;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--z) 18%,transparent),transparent 60%),var(--bg);color:var(--text);
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--z);box-shadow:0 0 12px var(--z)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{font:600 .82rem var(--mono);padding:6px 12px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);color:var(--mute);cursor:pointer}
.tab.on{color:#07070f;background:var(--z);border-color:var(--z)}
.who{font-size:.8rem;color:var(--mute)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 16px}
.card{width:100%;max-width:880px;background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:20px 22px;backdrop-filter:blur(10px);
  box-shadow:0 20px 60px -30px rgba(0,0,0,.7)}
.k{font:600 .72rem var(--mono);letter-spacing:.12em;color:var(--z)}
h1{font-family:var(--disp);font-size:clamp(1.4rem,3vw,2rem);line-height:1.15;margin:4px 0 6px}
p.lead{color:var(--mute);font-size:.95rem;line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
.fact{padding:10px 12px;border-radius:14px;border:1px solid var(--edge);background:var(--glass2)}
.fact b{display:block;font:600 1.25rem var(--mono)}
.fact span{font-size:.78rem;color:var(--mute)}
.btn{font:500 .95rem var(--font);padding:10px 18px;border-radius:12px;border:1px solid var(--edge);background:var(--glass2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--z);border-color:var(--z);color:#07070f;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.idrow input{font:500 1rem var(--mono);padding:9px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--glass2);color:var(--text);width:220px}
.err{color:var(--bad);font-size:.85rem}
.prog{display:flex;gap:4px;margin-bottom:10px}
.prog i{flex:1;height:6px;border-radius:4px;background:var(--glass2)}
.prog i.ok{background:var(--ok)} .prog i.bad{background:var(--bad)} .prog i.cur{background:var(--z)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.8rem;color:var(--mute)}
.tag{font:600 .72rem var(--mono);padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--z) 55%,transparent);color:var(--z)}
.q{font-size:1.12rem;line-height:1.55;margin:10px 0 12px;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;font:400 .98rem var(--font);padding:11px 14px;border-radius:12px;border:1px solid var(--edge);background:var(--glass2);color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.opt em{font:600 .85rem var(--mono);font-style:normal;color:var(--mute);min-width:18px}
.opt.sel{border-color:var(--z);box-shadow:0 0 0 2px color-mix(in srgb,var(--z) 35%,transparent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.opt:disabled{cursor:default}
.exp{margin-top:10px;padding:10px 14px;border-radius:12px;border-left:3px solid var(--ok);background:var(--glass2);font-size:.92rem;line-height:1.55}
.exp.no{border-left-color:var(--bad)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.cell{padding:10px 12px;border-radius:14px;border:1px solid var(--edge);background:var(--glass2)}
.cell b{font:600 1.4rem var(--mono);margin-right:6px}
.cell small{display:block;color:var(--mute);font-size:.78rem;line-height:1.35;margin-top:2px}
.cell.mis{border-color:var(--bad)} .cell.solid{border-color:var(--ok)}
.miss{max-height:130px;overflow:auto;font-size:.85rem;line-height:1.45;border-top:1px solid var(--edge);padding-top:8px}
.miss div{margin:4px 0}
.miss b{color:var(--bad);font-weight:500}
.stamp{margin-top:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.stamp code{font:600 1.15rem var(--mono);letter-spacing:.12em}
footer{text-align:center;font-size:.72rem;color:var(--dim);padding:8px 16px}
@media (max-width:640px){.opts{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr;gap:6px}.cell{padding:7px 9px}.cell b{font-size:1.1rem}.cell small{font-size:.72rem}.miss{max-height:96px}.card{padding:14px}main{padding:8px 10px}.tabs{margin-left:0}footer{padding:4px 10px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i></i>RESCUE MISSIONS</div>
  <span class="who" id="who"></span>
  <nav class="tabs" id="tabs" aria-label="เลือกโซน"></nav>
</header>
<main><section class="card" id="card" aria-live="polite"></section></main>
<footer>GNR2022 อิเล็กทรอนิกส์พื้นฐาน · ผศ.ดร.กุลวลัญช์ วรุณสิน · คณะวิศวกรรมศาสตร์ มหาวิทยาลัยรามคำแหง · © 2569</footer>
<script>
var DATA=/*__DATA__*/{};
var META=/*__META__*/{};
var ID_KEY='gnr2022_student', RES_KEY='gnr2022_results', DAY_KEY='gnr2022_days', SECRET='gnr2569', SECRETS=['ru2569','gnr2569'], MASK='xxxxxxxxxx';
var NOTA='ไม่มีข้อใดถูก', N_Q=12, PASS=10, TH='1234';
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function jget(st,k,d){try{var v=JSON.parse(st.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}}
function jset(st,k,v){try{st.setItem(k,JSON.stringify(v));}catch(e){}}
function stampCode(sid,zid){var s=sid+'|'+zid+'|'+SECRET,h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}
  var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',o='';for(var j=0;j<5;j++){o+=A[h%A.length];h=Math.floor(h/A.length);}return zid.toUpperCase()+'-'+o;}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function checkId(raw){var v=(raw||'').trim();if(SECRETS.indexOf(v.toLowerCase())>=0)return {ok:true,sid:MASK};
  var d=v.replace(/[\s-]/g,'');if(!/^\d{10}$/.test(d))return {ok:false,msg:'กรอกรหัสนักศึกษาเป็นตัวเลข 10 หลัก'};
  if(!/^[5-7]\d{9}$/.test(d))return {ok:false,msg:'รหัสต้องขึ้นต้นด้วยปีที่เข้าศึกษา เช่น 69xxxxxxxx'};return {ok:true,sid:d};}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
try{var th=localStorage.getItem('gnr2022_theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}

var me=jget(sessionStorage,ID_KEY,null), Z='z4', S=null;
var qz=(location.search.match(/[?&]z=(z[456])/)||[])[1]; if(qz)Z=qz;
function rec(){ if(!me)return null; var all=jget(localStorage,RES_KEY,{}); return ((all[me.sid]||{}).rescue||{})[Z]||null; }
function save(score,mis){
  if(!me)return; var all=jget(localStorage,RES_KEY,{}), r=all[me.sid]=all[me.sid]||{}, rs=r.rescue=r.rescue||{}, o=rs[Z]||{};
  rs[Z]={best:Math.max(score,o.best||0),last:score,mis:mis,max:N_Q,plays:(o.plays||0)+1,at:new Date().toISOString(),nick:me.nick||''};
  jset(localStorage,RES_KEY,all); var days=jget(localStorage,DAY_KEY,[]), t=ymd(new Date()); if(days.indexOf(t)<0){days.push(t);jset(localStorage,DAY_KEY,days.slice(-200));}
}
function setZone(z){Z=z;S=null;document.documentElement.style.setProperty('--z',META[z].col);
  try{history.replaceState(null,'','?z='+z);}catch(e){} renderTabs(); intro();}
function renderTabs(){
  $('#tabs').innerHTML=['z4','z5','z6'].map(function(z){var r=me?(((jget(localStorage,RES_KEY,{})[me.sid]||{}).rescue||{})[z]):null;
    return '<button class="tab'+(z===Z?' on':'')+'" data-z="'+z+'">'+z.toUpperCase()+(r&&r.best>=PASS?' ✓':'')+'</button>';}).join('');
  $('#who').textContent=me?(me.sid===MASK?'โหมดผู้สอน':'รหัส '+me.sid):'';
}
function intro(){
  var m=META[Z], r=rec(), c=$('#card');
  var h='<div class="k">RESCUE · ZONE '+Z.slice(1)+' · '+m.name+'</div><h1>ภารกิจกู้โซน '+Z.slice(1)+': '+m.th+'</h1>'+
    '<p class="lead">กลางภาคห้องเราทำโซนนี้ได้เฉลี่ย <b>'+m.pct+'%</b> ภารกิจนี้รวมข้อที่ห้องพลาดมากที่สุดมาให้ฝึกแบบข้อสอบจริง รวมถึงข้อที่คำตอบคือ "ไม่มีข้อใดถูก" '+
    'ทุกข้อให้กด <b>ส่ง · มั่นใจ</b> หรือ <b>ส่ง · ไม่แน่ใจ</b> ตามจริง เพื่อแยกความเข้าใจผิดออกจากการเดา</p>'+
    '<div class="facts"><div class="fact"><b>'+N_Q+' ข้อ</b><span>สุ่มจากคลัง '+DATA[Z].length+' ข้อทุกรอบ</span></div>'+
    '<div class="fact"><b>'+PASS+'/'+N_Q+'</b><span>ผ่านเกณฑ์ รับรหัสแสตมป์ R'+Z.slice(1)+'</span></div>'+
    '<div class="fact"><b>'+(r?r.best+'/'+r.max:'—')+'</b><span>ดีที่สุดของคุณ'+(r?' · เล่น '+r.plays+' รอบ':'')+'</span></div></div>';
  if(!me){ h+='<div class="row idrow"><input id="sid" inputmode="numeric" maxlength="12" placeholder="รหัสนักศึกษา 10 หลัก" aria-label="รหัสนักศึกษา"><button class="btn pri" id="go">เริ่มภารกิจ</button><span class="err" id="err"></span></div>'; }
  else h+='<div class="row"><button class="btn pri" id="go">เริ่มภารกิจ</button><a class="btn" href="'+m.game+'">ทบทวนในเกมโซน '+Z.slice(1)+'</a><a class="btn" href="../index.html">แผนที่</a></div>';
  if(me && r && r.best>=PASS) h+=stampBox();
  c.innerHTML=h;
  $('#go').onclick=function(){ if(!me){var v=checkId($('#sid').value); if(!v.ok){$('#err').textContent=v.msg;return;} me={sid:v.sid,nick:''}; jset(sessionStorage,ID_KEY,me); renderTabs();} start(); };
  var inp=$('#sid'); if(inp) inp.onkeydown=function(e){ if(e.key==='Enter') $('#go').click(); };
}
function stampBox(){ return '<div class="stamp">ผ่านภารกิจกู้โซน '+Z.slice(1)+' แล้ว · รหัสแสตมป์ <code>'+stampCode(me.sid,'r'+Z.slice(1))+'</code><div style="font-size:.76rem;color:var(--mute);margin-top:2px">แสดงรหัสนี้กับผู้สอน (นับเข้า Combo Stamp ตามที่ผู้สอนประกาศ)</div></div>'; }
function start(){
  var pool=shuffle(DATA[Z].slice()).slice(0,N_Q);
  S={qs:pool.map(function(it){ var o=it.c.map(function(t,i){return {t:t,ok:i===0};}), nota=o.filter(function(x){return x.t===NOTA;}), rest=shuffle(o.filter(function(x){return x.t!==NOTA;}));
      return {q:it.q,e:it.e,m:it.m,o:rest.concat(nota)}; }), i:0, pick:-1, log:[]};
  question();
}
function progress(){ return '<div class="prog">'+S.qs.map(function(q,i){ var l=S.log[i]; return '<i class="'+(l?(l.ok?'ok':'bad'):(i===S.i?'cur':''))+'"></i>'; }).join('')+'</div>'; }
function question(){
  var q=S.qs[S.i]; S.pick=-1;
  $('#card').innerHTML=progress()+'<div class="qhead"><span>ข้อ '+(S.i+1)+' / '+N_Q+'</span><span class="tag">เจาะ'+esc(q.m)+'</span></div>'+
    '<div class="q">'+esc(q.q)+'</div><div class="opts">'+q.o.map(function(o,i){ return '<button class="opt" data-i="'+i+'"><em>'+TH[i]+')</em><span>'+esc(o.t)+'</span></button>'; }).join('')+'</div>'+
    '<div class="row" id="act"><button class="btn pri" id="sure" disabled>ส่ง · มั่นใจ</button><button class="btn" id="unsure" disabled>ส่ง · ไม่แน่ใจ</button></div><div id="fb"></div>';
  document.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ if(S.log[S.i])return; S.pick=+b.dataset.i;
    document.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('sel',x===b);}); $('#sure').disabled=$('#unsure').disabled=false; }; });
  $('#sure').onclick=function(){answer(true);}; $('#unsure').onclick=function(){answer(false);};
}
function answer(sure){
  var q=S.qs[S.i], ok=q.o[S.pick].ok; S.log[S.i]={ok:ok,sure:sure,q:q};
  document.querySelectorAll('.opt').forEach(function(b,i){ b.disabled=true; b.classList.remove('sel'); if(q.o[i].ok)b.classList.add('ok'); else if(i===S.pick)b.classList.add('bad'); });
  var right=q.o.filter(function(o){return o.ok;})[0].t;
  $('#fb').innerHTML='<div class="exp'+(ok?'':' no')+'"><b>'+(ok?(sure?'ถูกต้อง และมั่นใจ':'ถูกต้อง แต่ยังไม่มั่นใจ ทบทวนเหตุผลอีกครั้ง'):(sure?'ผิดทั้งที่มั่นใจ นี่คือความเข้าใจผิดที่ต้องแก้':'ยังไม่ถูก'))+'</b> — '+(ok?'':'คำตอบคือ "'+esc(right)+'" · ')+esc(q.e)+'</div>';
  $('#act').innerHTML='<button class="btn pri" id="nx">'+(S.i<N_Q-1?'ข้อถัดไป':'ดูผลภารกิจ')+'</button>';
  $('#nx').onclick=function(){ if(S.i<N_Q-1){S.i++;question();} else result(); }; $('#nx').focus();
}
function result(){
  var L=S.log, score=L.filter(function(x){return x.ok;}).length, c=function(ok,su){return L.filter(function(x){return x.ok===ok&&x.sure===su;}).length;}, mis=c(false,true);
  save(score,mis); renderTabs();
  var pass=score>=PASS, wrong=L.filter(function(x){return !x.ok;}).sort(function(a,b){return (b.sure?1:0)-(a.sure?1:0);});
  var h='<div class="k">MISSION REPORT · ZONE '+Z.slice(1)+'</div><h1>'+score+' / '+N_Q+(pass?' · กู้โซนสำเร็จ':' · ยังไม่ผ่าน ลองอีกรอบ')+'</h1>'+
    '<div class="grid4"><div class="cell solid"><b>'+c(true,true)+'</b>ถูก + มั่นใจ<small>เข้าใจจริง</small></div>'+
    '<div class="cell"><b>'+c(true,false)+'</b>ถูก + ไม่แน่ใจ<small>ต้องย้ำ อาจเดาถูก</small></div>'+
    '<div class="cell mis"><b>'+mis+'</b>ผิด + มั่นใจ<small>ความเข้าใจผิด แก้ก่อนสอบ Final</small></div>'+
    '<div class="cell"><b>'+c(false,false)+'</b>ผิด + ไม่แน่ใจ<small>ยังไม่รู้ ทบทวนในเกมโซน '+Z.slice(1)+'</small></div></div>';
  if(wrong.length) h+='<div class="miss">'+wrong.map(function(x){ return '<div><b>'+(x.sure?'มั่นใจแต่ผิด':'ไม่แน่ใจ')+' · '+esc(x.q.m)+'</b> '+esc(x.q.q)+'</div>'; }).join('')+'</div>';
  if(pass) h+=stampBox();
  h+='<div class="row"><button class="btn pri" id="again">เล่นอีกรอบ (สุ่มข้อใหม่)</button><a class="btn" href="'+META[Z].game+'">ทบทวนในเกมโซน '+Z.slice(1)+'</a><a class="btn" href="../index.html">แผนที่</a></div>';
  $('#card').innerHTML=h; $('#again').onclick=start;
}
document.addEventListener('click',function(e){ var t=e.target.closest('[data-z]'); if(t) setZone(t.dataset.z); });
setZone(Z);
window.GNRRESCUE={data:DATA,stampCode:stampCode};
</script>
</body>
</html>
